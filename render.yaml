# Render Blueprint — see https://render.com/docs/blueprint-spec
# Deploy: connect this repo in the Render dashboard, it will detect this file
# and propose both services below. Fill in the `sync: false` env vars in the
# dashboard afterward (see INFRASTRUCTURE_TODO.md for where each one comes from).

services:
  - type: web
    name: flipsta-web
    runtime: node
    plan: starter # bump as traffic grows — see INFRASTRUCTURE_TODO.md scaling notes
    buildCommand: npm install && npm run build --workspace=packages/shared && npm run build --workspace=apps/web
    startCommand: npm run start --workspace=apps/web
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      # 27 Aug 2026 — the app's one canonical public URL, used anywhere a
      # server route needs to build an absolute redirect it can trust
      # regardless of proxy/Host quirks (see api/auth/signout/route.ts,
      # the fix for "sign out goes to localhost"). Not a secret — set
      # directly here rather than sync: false, so it can't be left blank.
      - key: NEXT_PUBLIC_SITE_URL
        value: https://flipsta.co.uk
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # 26 Aug 2026, Steven's "Flipsta It!" feature — the web app now makes
      # its own Claude calls too (finding candidate photos + the targeted
      # buy-request search, apps/web/lib/buyRequestSearch.ts), not just the
      # worker. Same key already set on flipsta-worker below — set the same
      # value here too, Render env vars are per-service.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_STANDARD
        sync: false
      - key: STRIPE_PRICE_PRO
        sync: false
      - key: STRIPE_PRICE_ELITE
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: NOTIFICATIONS_FROM_EMAIL
        sync: false
      # Section 7 — seller "Connect account" OAuth for cross-posting
      # (apps/web/lib/channelOAuth.ts). Only set the ones you've actually
      # registered for; a channel with any of its vars missing just shows
      # as "not connectable yet" instead of failing — see
      # INFRASTRUCTURE_TODO.md #9 for how to get each one.
      - key: CHANNEL_EBAY_CLIENT_ID
        sync: false
      - key: CHANNEL_EBAY_CLIENT_SECRET
        sync: false
      - key: CHANNEL_ETSY_CLIENT_ID
        sync: false
      - key: CHANNEL_DEPOP_CLIENT_ID
        sync: false
      - key: CHANNEL_DEPOP_CLIENT_SECRET
        sync: false
      - key: CHANNEL_DEPOP_AUTHORIZE_URL
        sync: false
      - key: CHANNEL_DEPOP_TOKEN_URL
        sync: false
      - key: CHANNEL_WHATNOT_CLIENT_ID
        sync: false
      - key: CHANNEL_WHATNOT_CLIENT_SECRET
        sync: false
      - key: CHANNEL_WHATNOT_AUTHORIZE_URL
        sync: false
      - key: CHANNEL_WHATNOT_TOKEN_URL
        sync: false
      - key: CHANNEL_STOCKX_CLIENT_ID
        sync: false
      - key: CHANNEL_STOCKX_CLIENT_SECRET
        sync: false
      - key: CHANNEL_STOCKX_AUTHORIZE_URL
        sync: false
      - key: CHANNEL_STOCKX_TOKEN_URL
        sync: false
      # 27 Aug 2026, Steven: "i need assistance setting up Awin api to fill
      # my store with goods... earn comission off items through affiliate
      # programs." Powers the admin "which of my approved merchants should
      # sync" picker (api/admin/awin-sync) — see INFRASTRUCTURE_TODO.md #6
      # for exactly where to get these once Steven's signed up.
      - key: AWIN_API_TOKEN
        sync: false
      - key: AWIN_PUBLISHER_ID
        sync: false

  - type: worker
    name: flipsta-worker
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build --workspace=packages/shared
    startCommand: npm run start --workspace=apps/worker
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: KEEPA_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      # 27 Aug 2026: deal-drop notifications (notifyDealMatches.ts) send
      # real email from the worker now, same Resend account already
      # declared on flipsta-web for ticket-update emails — same key value,
      # just also needs setting here since Render env vars are per-service.
      - key: RESEND_API_KEY
        sync: false
      - key: NOTIFICATIONS_FROM_EMAIL
        sync: false
      # 27 Aug 2026 — same Awin credentials as flipsta-web above; the
      # actual product-feed sync (jobs/syncAwinProducts.ts) runs here.
      - key: AWIN_API_TOKEN
        sync: false
      - key: AWIN_PUBLISHER_ID
        sync: false
